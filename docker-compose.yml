networks:
  ansible:
    external: true

services:
  agent-news:
    build: .
    container_name: agent-news
    env_file: .env
    ports:
      - "8085:8080"
    networks:
      - ansible
    volumes:
      - news-data:/data
      - hf-cache:/root/.cache/huggingface
      - wiki-data:/wiki
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  news-data:
  hf-cache:
  wiki-data:
